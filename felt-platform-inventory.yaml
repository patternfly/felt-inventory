  - id: rhds-infra
    name: Infrastructure
    description: CDN and content serving infrastructure. <a href="https://www.redhatstatic.com/dssf-001/">See all items at redhatstatic.com</a>.
    items:
      - name: CDN Files
        url: https://gitlab.cee.redhat.com/rhds/cdn_files/
        platform: GitLab
        org: rhds
        status: needs-decision
        description: Automated processing and file storage for CDN packages
        contacts: [Luke Dary]
        notes: >
          Auto-grabs files; publishing requires human button push.
          Luke is CMDB contact, checks flows most days.

      - name: CDN Serve
        url: https://gitlab.cee.redhat.com/rhds/cdn
        platform: GitLab
        org: rhds
        status: needs-decision
        description: Runtime server
        contacts: [Luke Dary]
        dependsOn: [CDN Files]
        consumers:
          - access.redhat.com
          - docs.redhat.com
          - "redhat.com (build-time)"
          - cloud.redhat.com/experts
        notes: >
          Built on Lightrail (formerly SSR platform). Runs Deno — looking for
          alternatives since Deno stopping development. Kyle Buchanan's teams
          use CDN as preferred distribution. Zack Hawkins bundles separately.
          Splunk analytics available on consumers (Mark and Arathy can query).

  - id: upstream
    name: Upstream Dependencies
    description: Open-source tooling maintained by team members that RHDS depends on
    items:
      - name: cem
        npm-name: "@pwrs/cem"
        url: https://github.com/bennypowers/cem
        npm-url: https://www.npmjs.com/package/@pwrs/cem
        docs: https://bennypowers.dev/cem/
        platform: GitHub
        org: bennypowers
        status: active
        description: Custom Elements Manifest tooling
        contacts: [Benny]
        tags: [dependency, personal]
        consumers: [red-hat-design-system, patternfly-elements]
        notes: RHDS dev server transitioning to this. It is a command-line tool for generating and querying Custom Elements Manifest files. It can analyze your codebase and generate rich metadata for your custom elements, facilitating documentation, tooling, and integration. It can also query that manifest for information about your package

      - name: asimonim
        npm-name: "@pwrs/asimonim"
        url: https://github.com/bennypowers/asimonim
        npm-url: https://www.npmjs.com/package/@pwrs/asimonim
        docs: https://bennypowers.dev/asimonim
        platform: GitHub
        org: bennypowers
        status: active
        description: A high-performance design tokens parser, validator, and language server, available as a CLI tool and Go library.
        contacts: [Benny]
        tags: [dependency, personal]
        notes: Upstream tooling dependency for RHDS

      - name: mappa
        npm-name: "@pwrs/mappa"
        url: https://github.com/bennypowers/mappa
        npm-url: https://www.npmjs.com/package/@pwrs/mappa
        docs: https://bennypowers.dev/mappa
        platform: GitHub
        org: bennypowers
        status: active
        description: The high-performance import map generator for the modern web, available as a CLI tool and Go library.
        contacts: [Benny]
        tags: [dependency, personal]
        consumers: [patternfly-elements]
        notes: Upstream tooling dependency for RHDS. Modern web applications use ES modules with bare specifiers like import { html } from 'lit'. Browsers need import maps to resolve these specifiers to actual URLs. Mappa generates import maps from your package.json dependencies, pointing to your local node_modules paths or to a path of your choosing (like /assets/packages/.... It's designed to be fast, with parallel dependency resolution.

      - name: lit-css
        npm-name: "@pwrs/lit-css"
        url: https://github.com/bennypowers/lit-css
        npm-url: https://www.npmjs.com/package/@pwrs/lit-css
        platform: GitHub
        org: bennypowers
        status: active
        description: CSS handling utilities for Lit web components
        contacts: [Benny]
        tags: [dependency, personal]
        notes: Build plugins to import css files as JavaScript tagged-template literal objects.

