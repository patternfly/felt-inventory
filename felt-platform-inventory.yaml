# Source of truth for codebases, tools, and infrastructure
# owned by the Felt Platform team.
#
# Update this file and regenerate the dashboard.

meta:
  title: Felt Platform Inventory
  lastUpdated: "2026-11-04"
  description: Map of codebases, tools, and infrastructure owned by the Felt Platform team

openQuestions:
  - question: CDN ownership going forward
    context: Luke Dary is current CMDB contact. Who manages it after the org change? It automatically grabs files, but publishing requires a human to push the button.
    mentioned: [Luke Dary]

  - question: Deno runtime replacement
    context: CDN runs on Deno, which was announced to stop development. Luke evaluating alternatives.
    mentioned: [Luke Dary]

  - question: Steven's static site generator evaluation
    context: Built for Steven's website. Worth evaluating for team use if time permits.
    mentioned: [Steven]

  - question: lit-ssr-wasm and golit adoption
    context: Benny offered it to Drupal team, got wishy-washy reception. Path forward?
    mentioned: [Benny]

  - question: What do we want to with inactive/archived projects?
    context: Some are not archived in GitHub yet - do we want to keep in org for historical purposes?

